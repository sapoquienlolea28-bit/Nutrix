<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d97757"><title>NUTRIX</title><link rel=manifest href=manifest.json><link rel=apple-touch-icon href=icon-192.png><link rel=icon href=icon-192.png>
<style>
:root{--bg:#faf7f4;--c:#fff;--t:#14110f;--m:#6f655d;--b:#e8e0d8;--g:#c4552d;--on:#fff}
[data-t=d]{--bg:#000;--c:#141110;--t:#f5f1ed;--m:#a39a92;--b:#2a2420;--g:#d97757;--on:#000}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}
main{max-width:640px;margin:auto;padding:14px 14px 96px}
.card{background:var(--c);border:1px solid var(--b);border-radius:18px;padding:14px;margin:12px 0;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button,input,select,.btn{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:9px;width:100%;margin:3px 0}
button,.btn{background:var(--g);color:var(--on);border:0;border-radius:10px;padding:9px 14px;cursor:pointer;display:inline-block;font-weight:600}
button.o,.btn.o{background:none;border:1px solid var(--b);color:var(--t);font-weight:400}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.it{display:flex;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--b)}.it>span:first-child{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom)}
nav a{flex:1;text-align:center;padding:9px 0;font-size:11px;color:var(--m);cursor:pointer}nav a.on{color:var(--g)}nav b{display:block;font-size:19px}
.tr{height:8px;background:var(--b);border-radius:6px;overflow:hidden;margin:4px 0 10px}.tr i{display:block;height:100%;background:var(--g);transition:width .5s}
.bl{display:flex;justify-content:space-between;font-size:13px}.mu,small{color:var(--m)}
.big{font-size:26px;font-weight:700;fill:var(--t)}.sm{font-size:9px;fill:var(--m)}
.msg{padding:10px 12px;border-radius:14px;margin:8px 0;background:var(--c);max-width:90%}.msg.u{background:var(--g);color:var(--on);margin-left:auto}
#mo{display:none;position:fixed;inset:0;background:#0009;align-items:flex-end;justify-content:center;z-index:9}
.sh{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}
h3{margin:14px 0 6px}ul{padding-left:18px;margin:4px 0}
</style></head><body><div id=app></div><div id=mo></div>
<script>
const $=s=>document.querySelector(s),K='nutrix1',R=Math.round,uid=()=>Math.random().toString(36).slice(2);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const lt=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),td=()=>lt(new Date());
// Referencia por 100 g (aprox. USDA; platos ecuatorianos = estimados, edítalos o crea los tuyos)
const DB=[['Arroz blanco cocido',130,2.7,28,.3],['Pechuga de pollo cocida',165,31,0,3.6],['Huevo entero',143,12.6,.7,9.5],['Carne de res magra cocida',217,26,0,12],['Atún en agua',116,26,0,.8],['Salmón cocido',206,22,0,12],['Pescado blanco cocido',105,23,0,1],['Lomo de cerdo cocido',242,27,0,14],['Leche entera',61,3.2,4.8,3.3],['Yogur natural',61,3.5,4.7,3.3],['Queso fresco',264,17,3,21],['Pan blanco',265,9,49,3.2],['Avena cruda',389,17,66,7],['Pasta cocida',158,5.8,31,.9],['Papa cocida',87,1.9,20,.1],['Yuca cocida',160,1.4,38,.3],['Verde (plátano) cocido',116,.8,31,.2],['Maduro frito',230,1,34,11],['Banana',89,1.1,23,.3],['Manzana',52,.3,14,.2],['Naranja',47,.9,12,.1],['Aguacate',160,2,8.5,14.7],['Tomate',18,.9,3.9,.2],['Lechuga',15,1.4,2.9,.2],['Brócoli cocido',35,2.4,7,.4],['Zanahoria',41,.9,10,.2],['Frijoles cocidos',127,8.7,23,.5],['Lentejas cocidas',116,9,20,.4],['Maní',567,26,16,49],['Aceite de oliva',884,0,0,100],['Azúcar',387,0,100,0],['Hamburguesa con queso',295,17,24,14],['Pizza de queso',266,11,33,10],['Papas fritas',312,3.4,41,15],['Gaseosa de cola',42,0,10.6,0],['Encebollado (est.)',70,7,8,1.5],['Seco de pollo (est.)',130,10,12,5],['Bolón de verde (est.)',230,4,28,11],['Ceviche de camarón (est.)',90,10,8,2],['Fritada (est.)',330,24,2,25],['Locro de papa (est.)',85,3,11,3.5]].map(([n,k,p,c,f])=>({n,b:[k,p,c,f]}));
const FV=/manzana|banana|naranja|aguacate|tomate|lechuga|br[óo]coli|zanahoria|fruta|verdura|ensalada|papaya|mora|fresa|pi[ñn]a|mango|espinaca|cebolla|pepino/i,PR=/hamburgues|pizza|fritas|gaseosa|snack|chips|donut|helado|salchipapa|galleta|nugget/i,LG=/frijol|lenteja|garbanzo|chocho|haba/i;
const MEALS=['Desayuno','Almuerzo','Cena','Snacks'];const UN=[['gramos',1],['cucharaditas',5],['cucharadas',15],['tazas',240]];
let S=Object.assign({p:null,log:{},fav:[],cus:[],fq:{},api:'',cr:{on:0,t:'08:00'},cd:{},ch:[],th:'',wa:{},bk:''},JSON.parse(localStorage[K]||'{}'));
const save=()=>localStorage[K]=JSON.stringify(S);
document.documentElement.dataset.t=S.th||'d';
let V=S.p?'hoy':'perfil',day=td(),M='Desayuno',RS=[],SC={},busy=0;
const T=x=>x.b.map(v=>v*x.g/100),tot=a=>a.reduce((o,x)=>{const t=T(x);return o.map((v,i)=>v+t[i])},[0,0,0,0]);
function tg(){const p=S.p;if(!p)return null;const m=p.s=='m',minor=p.a<18;let bmr;if(p.a>=18)bmr=10*p.w+6.25*p.h-5*p.a+(m?5:-161);else if(p.a<10)bmr=m?22.7*p.w+495:22.5*p.w+499;else bmr=m?17.5*p.w+651:12.2*p.w+746;
const nt=p.neat!=null?p.neat:Math.min(p.act||0,3),ne=[1.2,1.3,1.4,1.5][nt],fr=Math.min(p.fr||0,7),pal=ne+.03*fr,tdee=bmr*pal,x=p.g=='x'&&!minor,k=R(tdee*(x?1.1:1)),pr=R(p.w*(x?1.8:minor?1.2:p.a>=65?1.3:1.4)),f=R(k*(minor?.3:.27)/9);
return{bmr:R(bmr),neat:R(bmr*(ne-1)),ex:R(bmr*.03*fr),tdee:R(tdee),k,p:pr,f,c:R((k-pr*4-f*9)/4),minor}}
function th(){const d=document.documentElement;d.dataset.t=S.th=d.dataset.t=='d'?'l':'d';save()}
const NAV=[['hoy','🏠','Hoy'],['esc','📷','Escáner'],['inf','📊','Informe'],['co','💬','Entrenador'],['perfil','👤','Perfil']];
function go(v){V=v;render();scrollTo(0,0)}
function render(){$('#app').innerHTML=`<main><div class=row><h2 style="margin:0;display:flex;gap:8px;align-items:center"><i style="width:14px;height:14px;border-radius:50%;background:var(--g)"></i>NUTRIX</h2><button class=o onclick="th()">◐</button></div>${{hoy:vHoy,esc:vEsc,inf:vInf,co:vCo,perfil:vPerfil}[V]()}</main>${S.p?`<nav>${NAV.map(([k,i,l])=>`<a class="${V==k?'on':''}" onclick="go('${k}')"><b>${i}</b>${l}</a>`).join('')}</nav>`:''}`}
const ring=(v,m)=>{const C=2*Math.PI*52,r=m?Math.min(v/m,1):0;return `<svg viewBox="0 0 120 120" width=160><circle cx=60 cy=60 r=52 fill=none stroke="var(--b)" stroke-width=10 /><circle cx=60 cy=60 r=52 fill=none stroke="var(--g)" stroke-width=10 stroke-linecap=round stroke-dasharray="${C*r} ${C}" transform="rotate(-90 60 60)" style="transition:stroke-dasharray .6s"/><text x=60 y=60 text-anchor=middle class=big>${R(v)}</text><text x=60 y=76 text-anchor=middle class=sm>${m?'de '+m+' kcal':'kcal'}</text></svg>`};
const bar=(l,v,m)=>`<div class=bl><span>${l}</span><span>${R(v)}${m?' / '+m:''} g</span></div><div class=tr><i style="width:${m?Math.min(100,v/m*100):0}%"></i></div>`;
function wkc(){const g=tg(),ds=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return lt(d)}),v=ds.map(d=>tot(S.log[d]||[])[0]),mx=Math.max(...v,g.k,1);return `<svg viewBox="0 0 280 100" width=100%>${v.map((x,i)=>`<rect x=${i*40+6} y=${80-x/mx*70} width=28 height=${x/mx*70} rx=6 fill="var(--g)" opacity=${ds[i]==day?1:.45}/><text x=${i*40+20} y=94 text-anchor=middle font-size=9 fill="var(--m)">${ds[i].slice(8)}</text>`).join('')}</svg>`}
function vHoy(){const L=S.log[day]||[],t=tot(L),g=tg(),m=1;
return `<div class=card style=text-align:center><div class=row><button class=o onclick="dd(-1)">‹</button><b>${day==td()?'Hoy':day}</b><button class=o onclick="dd(1)">›</button></div>${ring(t[0],m&&g.k)}<div style=text-align:left>${bar('Proteínas',t[1],m&&g.p)}${bar('Carbohidratos',t[2],m&&g.c)}${bar('Grasas',t[3],m&&g.f)}</div><small>${t[0]<g.k?'Te quedan '+R(g.k-t[0])+' kcal de tu referencia':'Ya cubriste tu referencia de hoy'}${g.minor?' · es un nivel de mantenimiento, no una meta para comer menos':''}</small></div>
${S.cr.on?`<div class="card row"><span>💊 Creatina · ${S.cr.t}</span><button class="${S.cd[day]?'':'o'}" onclick="ctk()">${S.cd[day]?'✓ Tomada':'Marcar tomada'}</button></div>`:''}
${racha()}${sem()}${bkw()}<div class="card row"><span>💧 Agua: ${S.wa[day]||0} / ${Math.max(6,R(S.p.w*35/250))} vasos</span><span><button class=o onclick="wt(-1)">−</button> <button onclick="wt(1)">+</button></span></div>${MEALS.map(m=>meal(m,L)).join('')}<div class=card><b>Últimos 7 días (kcal)</b>${wkc()}</div>`}
const ds=n=>{const d=new Date();d.setDate(d.getDate()-n);return lt(d)};
const okd=d=>new Set((S.log[d]||[]).map(x=>x.m)).size>=3;
function streak(){let n=0,i=okd(td())?0:1;for(;i<400&&okd(ds(i));i++)n++;return n}
function best(){let b=0,c=0;for(let i=400;i>=0;i--){c=okd(ds(i))?c+1:0;b=Math.max(b,c)}return b}
function sd(d){day=d;render()}
function racha(){const n=streak();return `<div class=card><div class=row><b>${n?'🔥':'◌'} Racha: ${n} ${n==1?'día':'días'}</b><small>Mejor: ${best()}</small></div><div class=row style="margin:10px 0 4px;gap:2px">${[...Array(14)].map((_,i)=>ds(13-i)).map(d=>`<div onclick="sd('${d}')" style="text-align:center;cursor:pointer;flex:1"><div style="width:20px;height:20px;margin:auto;border-radius:50%;background:${okd(d)?'var(--g)':(S.log[d]||[]).length?'var(--b)':'transparent'};border:2px solid ${d==day?'var(--t)':'var(--b)'}"></div><small>${d.slice(8)}</small></div>`).join('')}</div><small>Suma cuando registras al menos 3 comidas del día. Toca un día para verlo.</small></div>`}
const sem=()=>[0,1].includes(new Date().getDay())?`<div class="card row"><span>📊 Tu cierre de la semana está listo</span><button onclick="go('inf')">Ver</button></div>`:'';
function cierre(){const g=tg(),d7=[...Array(7)].map((_,i)=>ds(i)).filter(okd);if(d7.length<3)return `<div class=card><b>Cierre de la semana</b><p class=mu>Registra al menos 3 días completos (3 comidas) para evaluar tu semana.</p></div>`;
const avg=d7.reduce((a,d)=>a+tot(S.log[d])[0],0)/d7.length,bal=R(avg-g.tdee),gap=R(avg-g.k),pc=gap/g.k,x=S.p.g=='x'&&!g.minor,est=bal>150?'superávit':bal<-150?'déficit':'mantenimiento';let m;
if(Math.abs(pc)<=.08)m=x?'¡Hiciste bien tu volumen! Estuviste dentro de tu rango.':'¡Buen trabajo! Estuviste dentro de tu rango.';
else if(pc<0)m=x?`Te quedaste ~${-gap} kcal/día por debajo de tu volumen. Para ganar masa conviene sumar algo más, por ejemplo un snack con proteína y carbohidrato.`:`Comiste ~${-gap} kcal/día menos que tu referencia. Si no fue intencional, revisa si faltó registrar o suma una comida pequeña.`;
else m=x?`Estuviste ~${gap} kcal/día sobre tu objetivo de volumen. Si tu peso sube muy rápido, puedes ajustar un poco.`:`Comiste ~${gap} kcal/día más que tu referencia; es normal que varíe de una semana a otra.`;
return `<div class=card><b>Cierre de la semana</b><p>Promedio: <b>${R(avg)} kcal/día</b> en ${d7.length} días completos.<br>Frente a tu gasto (${g.tdee}): <b>${bal>0?'+':''}${bal} kcal/día → ${est}</b><br>Tu referencia: ${g.k} kcal${x?' (volumen)':''}</p><p>${m}</p><small>Solo cuenta días con 3 o más comidas registradas. Es orientativo, no médico.</small></div>`}
function wt(n){S.wa[day]=Math.max(0,(S.wa[day]||0)+n);save();render()}
const bkw=()=>Object.keys(S.log).length&&(!S.bk||(new Date(td())-new Date(S.bk))/864e5>7)?`<div class="card row"><span>Haz una copia de tus datos</span><button onclick="go('perfil')">Ir</button></div>`:'';
function dd(n){const d=new Date(day+'T12:00');d.setDate(d.getDate()+n);if(lt(d)>td())return;day=lt(d);render()}
const meal=(m,L)=>{const a=L.filter(x=>x.m==m),t=tot(a);return `<div class=card><div class=row><b>${m}</b><span class=mu>${R(t[0])} kcal</span><button onclick="op('${m}')">+</button></div>${a.map(x=>{const q=T(x);return `<div class=it><span>${esc(x.n)}<br><small>${R(q[0])} kcal · P${R(q[1])} C${R(q[2])} G${R(q[3])}</small></span><input type=number value=${x.g} style=width:72px onchange="eg('${x.id}',this.value)"><span>g</span><button class=o onclick="rm('${x.id}')">✕</button></div>`}).join('')}${a.length?`<button class=o style="margin-top:8px" onclick="rec('${m}')">★ Guardar como receta</button>`:''}</div>`};
function eg(id,v){S.log[day].find(x=>x.id==id).g=Math.max(0,+v||0);save();render()}
function rm(id){S.log[day]=S.log[day].filter(x=>x.id!=id);save();render()}
function rec(m){const a=S.log[day].filter(x=>x.m==m),n=prompt('Nombre de la receta');if(!n)return;const gs=a.reduce((s,x)=>s+x.g,0)||1;S.cus.push({n:'🍲 '+n,b:tot(a).map(v=>v/gs*100)});save();alert('Receta guardada: búscala al añadir alimentos.')}
function ctk(){S.cd[day]=!S.cd[day];save();render()}
function op(m){M=m;$('#mo').innerHTML=`<div class=sh><div class=row><b>Añadir a ${m}</b><button class=o onclick="cl()">✕</button></div><input id=q placeholder="Buscar alimento (USDA: en inglés)" oninput="fd(this.value)"><div id=rs></div><p id=ld class=mu></p><details><summary>Crear alimento personalizado (por 100 g)</summary><input id=cn placeholder=Nombre><input id=ck type=number placeholder=kcal><input id=cp type=number placeholder="Proteína g"><input id=cc type=number placeholder="Carbohidratos g"><input id=cf type=number placeholder="Grasa g"><button onclick="nf()">Guardar alimento</button></details><p><button class=o onclick="cl();go('esc')">📷 Escanear con foto</button></p></div>`;$('#mo').style.display='flex';fd('')}
const cl=()=>{$('#mo').style.display='none';render()};
var FT;const ld=t=>{const l=$('#ld');if(l)l.textContent=t};function fd(q){q=q.trim();const l=q.toLowerCase();RS=q?[...S.cus,...DB].filter(x=>x.n.toLowerCase().includes(l)):[...S.fav,...Object.values(S.fq).sort((a,b)=>b.c-a.c).slice(0,8)];lr();clearTimeout(FT);if(S.api&&q.length>2)FT=setTimeout(()=>{ld('Buscando en USDA…');fetch(S.api+'/food?q='+encodeURIComponent(q)).then(r=>r.json()).then(x=>{if($('#q')&&$('#q').value.trim()==q&&Array.isArray(x)){RS=RS.concat(x.map(f=>({n:f.name,b:[f.kcal,f.p,f.c,f.f],u:1})));lr()}}).catch(()=>{}).finally(()=>ld(''))},600)}
function lr(){$('#rs').innerHTML=RS.length?RS.map((x,i)=>`<div class=it style="flex-wrap:wrap"><span style="flex:1 1 100%">${esc(x.n)}<br><small>${R(x.b[0])} kcal · P${R(x.b[1])} C${R(x.b[2])} G${R(x.b[3])} /100g${x.u?' · USDA':''}</small></span><input id=g${i} type=number step=any value=100 style=width:70px><select id=u${i} style=width:auto onchange="$('#g${i}').value=this.value==0?100:1">${UN.map((u,k)=>`<option value=${k}>${u[0]}</option>`).join('')}</select><button class=o onclick="fv(${i})">☆</button><button onclick="ad(${i})">+</button></div>`).join(''):'<p class=mu>Sin resultados. Prueba otro nombre'+(S.api?'':' o conecta USDA en Perfil')+'.</p>'}
function fv(i){const x=RS[i];if(!S.fav.some(f=>f.n==x.n))S.fav.push({n:x.n,b:x.b});save();alert('Guardado en favoritos')}
function ad(i){const x=RS[i],g=+$('#g'+i).value*UN[+$('#u'+i).value][1];if(!g)return;(S.log[day]=S.log[day]||[]).push({id:uid(),m:M,n:x.n,g,b:x.b});const q=S.fq[x.n]=S.fq[x.n]||{n:x.n,b:x.b,c:0};q.c++;save();cl()}
function nf(){const v=id=>$('#'+id).value,n=v('cn');if(!n)return;S.cus.push({n,b:['ck','cp','cc','cf'].map(i=>+v(i)||0)});save();fd($('#q').value)}
// ESCÁNER
const rz=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1024/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});
async function pf(el){const f=el.files[0];if(!f)return;SC={img:await rz(f)};render()}
function vEsc(){const it=SC.items;return `<div class=card><b>Escáner de comidas</b><p class=mu>Haz una foto o sube una imagen. La IA propone alimentos y porciones; son estimaciones y puedes corregirlas.</p><div class=row><label class=btn>📷 Cámara<input type=file accept=image/* capture=environment hidden onchange=pf(this)></label><label class="btn o">🖼 Galería<input type=file accept=image/* hidden onchange=pf(this)></label></div></div>${SC.img?`<div class=card><img src="${SC.img}" style="width:100%;border-radius:12px;margin-bottom:8px"><button onclick=an() ${busy?'disabled':''}>${busy?'Analizando…':'Analizar con IA'}</button></div>`:''}${it?`<div class=card><b>Alimentos detectados</b>${it.map((x,i)=>`<div class=it style="flex-wrap:wrap"><input value="${esc(x.n)}" style="flex:1 1 100%" onchange="SC.items[${i}].n=this.value"><input type=number step=any value=${x.q} style=width:76px onchange="sq(${i},this.value)"><select style=width:auto onchange="sun(${i},this.value)">${UN.map((u,k)=>`<option value=${k} ${x.u==k?'selected':''}>${u[0]}</option>`).join('')}</select><span class=mu style=flex:1>≈${R(x.g)} g · ${R(T(x)[0])} kcal${x.conf=='baja'?' ⚠':''}</span><button class=o onclick="SC.items.splice(${i},1);render()">✕</button></div>`).join('')}${(SC.q||[]).map(q=>`<p class=mu>❓ ${esc(q)}</p>`).join('')}<p class=mu>Equivalencias aprox.: 1 cucharadita ≈ 5 g, 1 cucharada ≈ 15 g, 1 taza ≈ 240 g. ⚠ = poca certeza: revisa.</p><select id=sm>${MEALS.map(m=>`<option>${m}</option>`).join('')}</select><button onclick=sa()>Añadir al diario</button></div>`:''}`}
async function an(){if(!S.api){alert('Falta conectar el servidor de IA (Perfil). Mientras tanto añade alimentos con la búsqueda manual.');return}busy=1;render();try{const d=await(await fetch(S.api+'/vision',{method:'POST',body:JSON.stringify({image:SC.img.split(',')[1]})})).json();if(d.error)throw d.error;SC.items=d.items.filter(x=>x.g>0).map(x=>({n:x.n,g:x.g,q:x.g,u:0,conf:x.conf,b:[x.k,x.p,x.c,x.f].map(v=>v/x.g*100)}));SC.q=d.preguntas||[]}catch(e){alert('No se pudo analizar: '+e)}busy=0;render()}
function sq(i,v){const x=SC.items[i];x.q=+v||0;x.g=x.q*UN[x.u][1];render()}
function sun(i,v){const x=SC.items[i];x.u=+v;x.q=Math.round(x.g/UN[x.u][1]*10)/10;render()}
function sa(){const m=$('#sm').value;(S.log[day]=S.log[day]||[]).push(...SC.items.map(x=>({id:uid(),m,n:x.n,g:x.g,b:x.b})));SC={};save();V='hoy';render()}
// INFORME
function wk(){const ds=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-i);return lt(d)}),all=ds.flatMap(d=>S.log[d]||[]),days=ds.filter(d=>(S.log[d]||[]).length).length,m={};all.forEach(x=>{const o=m[x.n]=m[x.n]||{n:x.n,c:0,g:0,p:0};o.c++;o.g+=x.g;o.p+=T(x)[1]});return{days,all,l:Object.values(m).sort((a,b)=>b.c-a.c||b.g-a.g),t:tot(all)}}
function vInf(){const w=wk(),g=tg();if(!w.days)return `<div class=card>No hay registros en los últimos 7 días. Registra tus comidas y aquí aparecerá tu informe semanal.</div>`;
const s=w.t[1]*4+w.t[2]*4+w.t[3]*9||1,pc=[w.t[1]*4,w.t[2]*4,w.t[3]*9].map(v=>R(v/s*100)),fv=w.all.filter(x=>FV.test(x.n)).length,pro=w.all.filter(x=>PR.test(x.n)).length,pr=[...w.l].sort((a,b)=>b.p-a.p).slice(0,3),ok=[],mj=[];
w.days>=5?ok.push(`Registraste ${w.days} de 7 días: ¡muy buena constancia!`):mj.push(`Registraste ${w.days} de 7 días; con más registros el análisis será más fiable.`);
fv>=w.days*2?ok.push('Frutas y verduras aparecen con frecuencia.'):mj.push(`Frutas y verduras: ${fv} registros en la semana. Podrías sumar una porción más al día.`);
w.l.length>=15?ok.push(`Buena variedad: ${w.l.length} alimentos distintos.`):mj.push(`Variedad de ${w.l.length} alimentos: prueba rotar proteínas y cereales.`);
if(!w.all.some(x=>LG.test(x.n)))mj.push('No aparecen legumbres: aportan fibra y hierro y combinan bien con arroz.');
if(pro>=3)mj.push(`Hay ${pro} registros de comida rápida o muy procesada. No registramos sodio ni azúcar añadida, así que es solo una pista.`);
const av=w.t[1]/w.days;if(av<g.p*.8)mj.push(`Proteína media ${R(av)} g/día frente a ~${g.p} g de referencia: quizá falte registrar o añadir una fuente.`);else ok.push('Tu proteína diaria está cerca de la referencia.');
return `${cierre()}<div class=card><b>Informe de los últimos 7 días</b><h3>1. Resumen</h3><p>${w.days} días registrados · media ${R(w.t[0]/w.days)} kcal/día · ${w.all.length} alimentos anotados.</p><h3>2. Top 10 más consumidos</h3><ol>${w.l.slice(0,10).map(x=>`<li>${esc(x.n)} <small>${x.c} veces · ${R(x.g)} g</small></li>`).join('')}</ol><small>Menos consumidos: ${w.l.slice(-3).map(x=>esc(x.n)).join(', ')}</small><h3>3. Macronutrientes (% kcal)</h3>${bar('Proteínas '+pc[0]+'%',pc[0],100).replace(' g','')}${bar('Carbohidratos '+pc[1]+'%',pc[1],100).replace(' g','')}${bar('Grasas '+pc[2]+'%',pc[2],100).replace(' g','')}<p>Fuentes principales de proteína: ${pr.map(x=>esc(x.n)).join(', ')}.</p><h3>4. Hábitos para mantener</h3><ul>${ok.map(x=>`<li>${x}</li>`).join('')||'<li>Seguir registrando ya es un gran hábito.</li>'}</ul><h3>5. Hábitos para mejorar</h3><ul>${mj.map(x=>`<li>${x}</li>`).join('')||'<li>Nada destacable esta semana.</li>'}</ul><h3>6. Para la próxima semana</h3><ul><li>Añade una fruta o verdura a cada comida principal.</li><li>Alterna la proteína (huevo, pescado, legumbres, pollo, lácteos).</li><li>Registra también snacks y bebidas.</li></ul><h3>7. Ideas de comidas</h3><ul><li>Arroz + lentejas + ensalada + huevo.</li><li>Pescado al horno con yuca y verduras.</li><li>Avena con leche, banana y maní.</li></ul><small>Orientativo, basado en lo que registraste (puede estar incompleto). No es consejo médico.</small></div><button onclick="go('co');ask('Hazme mi informe semanal detallado con mis registros reales')">💬 Análisis detallado con el entrenador IA</button>`}
// ENTRENADOR
function vCo(){return `<div class=card><b>Entrenador NUTRIX</b><p class=mu>Responde con tus registros reales. Pueden estar incompletos: es orientativo, no médico.</p><div class=row style=flex-wrap:wrap>${[['¿Qué he comido más?','top'],['¿Como variado?','var'],['Mis proteínas','pro']].map(([t,k])=>`<button class=o onclick="loc('${k}')">${t}</button>`).join('')}</div></div>${S.ch.slice(-12).map(m=>`<div class="msg ${m.r}">${esc(m.t).replace(/\*\*/g,'').replace(/\n/g,'<br>')}</div>`).join('')}${busy?'<div class=msg>…</div>':''}<div class=row><input id=cq placeholder="Pregunta sobre tu alimentación" onkeydown="event.key=='Enter'&&ask(this.value)"><button onclick="ask($('#cq').value)">➤</button></div>`}
function loc(k){const w=wk();let u,t;if(k=='top'){u='¿Qué he comido más esta semana?';t=w.days?'Según tus registros: '+w.l.slice(0,5).map(x=>`${x.n} (${x.c} veces)`).join(', ')+'.':'Aún no tengo registros de esta semana.'}else if(k=='var'){u='¿Estoy comiendo variado?';t=w.days?`Anotaste ${w.l.length} alimentos distintos en ${w.days} días. ${w.l.length>=15?'¡Buena variedad!':'Hay margen para probar alimentos nuevos.'} Recuerda que puede faltar algo por registrar.`:'Aún no tengo registros.'}else{u='¿Qué fuentes de proteína consumo más?';const p=[...w.l].sort((a,b)=>b.p-a.p).slice(0,4);t=w.days?'Tus mayores aportes de proteína: '+p.map(x=>`${x.n} (${R(x.p)} g)`).join(', ')+'.':'Aún no tengo registros.'}S.ch.push({r:'u',t:u},{r:'a',t});save();render()}
async function ask(q){q=(q||'').trim();if(!q)return;S.ch.push({r:'u',t:q});if(!S.api){S.ch.push({r:'a',t:'Para preguntas libres necesito el servidor de IA (Perfil). Los botones de arriba funcionan sin conexión.'});save();return render()}busy=1;save();render();const w=wk(),p=S.p,sm=`Días con registro: ${w.days}/7. Alimentos más consumidos: ${w.l.slice(0,10).map(x=>x.n+' x'+x.c+' ('+R(x.g)+' g)').join('; ')}. Totales semana: ${R(w.t[0])} kcal, P${R(w.t[1])} C${R(w.t[2])} G${R(w.t[3])} g. Frecuentes: ${Object.values(S.fq).sort((a,b)=>b.c-a.c).slice(0,10).map(x=>x.n).join(', ')}.`;
const prompt=`Eres un entrenador nutricional cercano, claro y motivador. Responde en español, breve. Usa SOLO los datos de registro que te doy; si falta información, dilo y no inventes. No clasifiques alimentos como buenos o malos, no fomentes restricciones ni déficits agresivos, no des diagnósticos médicos. Recuerda que los registros pueden estar incompletos y que tu análisis es orientativo.\nPerfil: ${p.a} años, objetivo ${p.g}.\nDatos: ${sm}\nPregunta: ${q}`;
try{const d=await(await fetch(S.api+'/coach',{method:'POST',body:JSON.stringify({prompt})})).json();if(d.error)throw d.error;S.ch.push({r:'a',t:d.text})}catch(e){S.ch.push({r:'a',t:'No pude conectar con la IA: '+e})}busy=0;save();render()}
// PERFIL
function vPerfil(){const p=S.p||{a:'',s:'m',w:'',h:'',g:'e',act:1,fr:3,ty:''},g=tg(),o=(v,l,c)=>`<option value="${v}" ${c==v?'selected':''}>${l}</option>`;
return `<div class=card><b>${S.p?'Tu perfil':'Bienvenido a NUTRIX — gratis, sin suscripciones'}</b><p class=mu>Tus datos se guardan solo en este dispositivo.</p>Edad<input id=pa type=number value="${p.a}">Sexo (solo para la fórmula metabólica)<select id=ps>${o('m','Hombre',p.s)}${o('f','Mujer',p.s)}</select>Peso (kg)<input id=pw type=number step=.1 value="${p.w}">Altura (cm)<input id=ph type=number value="${p.h}">Objetivo<select id=pg>${o('k','Mantenimiento',p.g)}${o('e','Alimentación equilibrada',p.g)}${o('x','Aumento de masa muscular',p.g)}</select>Actividad diaria, sin contar el entrenamiento (NEAT)<select id=pneat>${['Casi todo el día sentado','De pie o caminando un poco','Camino bastante / estoy activo','Trabajo físico o muy activo'].map((l,i)=>o(i,l,p.neat!=null?p.neat:Math.min(p.act||0,3))).join('')}</select>Entrenamientos por semana<input id=pfr type=number value="${p.fr}">Tipo de entrenamiento<input id=pty value="${esc(p.ty)}" placeholder="Pesas, running, fútbol…"><button onclick=sp()>Guardar perfil</button></div>
${g?`<div class=card><b>Estimaciones</b><p>TMB (metabolismo basal): ${g.bmr} kcal<br>+ Actividad diaria (NEAT): ${g.neat} kcal<br>+ Entrenamiento: ${g.ex} kcal<br>= Gasto total (TDEE): ${g.tdee} kcal<br>Tope diario de referencia: <b>${g.k} kcal</b><br>P ${g.p} g · C ${g.c} g · G ${g.f} g</p><small>${g.minor?'Menores: ecuaciones Schofield (OMS) y nivel de mantenimiento, sin déficit. ':''}Son estimaciones y pueden necesitar ajustes. No recomendamos déficits agresivos. Si tienes una condición médica, consulta a tu profesional de salud.</small></div>
<div class=card><b>💊 Recordatorio de creatina</b><div class=row><label><input type=checkbox style=width:auto ${S.cr.on?'checked':''} onchange="crt(this.checked)"> Activar</label><input type=time value="${S.cr.t}" style=width:120px onchange="crtime(this.value)"></div><small>${S.cr.pu?'✓ Aviso en segundo plano activo.':'Con el servidor conectado y la app instalada avisa aunque esté cerrada; si no, solo con la app abierta.'}</small>${S.cr.pu?' <button class=o onclick=ptest()>Probar aviso ahora</button>':''}</div>
<div class=card><b>Servidor de IA (USDA + fotos + entrenador)</b><input id=api value="${esc(S.api)}" placeholder="https://nutrix.tuusuario.workers.dev"><button class=o onclick="S.api=$('#api').value.trim().replace(/\\/$/,'');save();alert('Guardado')">Guardar URL</button><small>Sin esto la app funciona con la base local y registro manual. Ver worker.js.</small></div>
<div class=card><b>Copia de seguridad</b><p class=mu>${S.bk?'Última copia: '+S.bk:'Aún no has hecho una copia.'}</p><div class=row style=flex-wrap:wrap><button onclick="ex('j')">Guardar copia</button><label class="btn o">Restaurar<input type=file accept=.json hidden onchange=imp(this)></label><button class=o onclick="ex('c')">CSV</button><button class=o onclick="del()">Eliminar todo</button></div></div>`:''}`}
function sp(){const v=i=>$('#'+i).value,p={a:+v('pa'),s:v('ps'),w:+v('pw'),h:+v('ph'),g:v('pg'),neat:+v('pneat'),fr:+v('pfr'),ty:v('pty')};if(!(p.a>=3&&p.a<=110&&p.w>0&&p.h>0))return alert('Completa edad (3 a 110), peso y altura.');S.p=p;save();V='hoy';render()}
const b64=x=>{x=(x+'='.repeat((4-x.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(x),c=>c.charCodeAt(0))};
async function psub(on){try{const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();
if(!on){if(sub){await fetch(S.api+'/unsub',{method:'POST',body:JSON.stringify({endpoint:sub.endpoint})}).catch(()=>{});await sub.unsubscribe()}S.cr.pu=0;save();return render()}
if(await Notification.requestPermission()!='granted')return alert('Permite las notificaciones para recibir el aviso.');
const k=(await(await fetch(S.api+'/vapid')).json()).key;if(!k)throw new Error('el servidor no devolvió la clave');
sub=sub||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(k)});
const r=await(await fetch(S.api+'/sub',{method:'POST',body:JSON.stringify({sub,t:S.cr.t,off:new Date().getTimezoneOffset()})})).json();if(r.error)throw new Error(r.error);
S.cr.pu=1;save();render();alert('Listo: recibirás el aviso a las '+S.cr.t+' aunque la app esté cerrada.')}catch(e){alert('No se pudo activar el aviso en segundo plano: '+e.message)}}
async function ptest(){try{const s=await(await navigator.serviceWorker.ready).pushManager.getSubscription();if(!s)return alert('Primero activa el recordatorio.');const r=await(await fetch(S.api+'/test',{method:'POST',body:JSON.stringify({endpoint:s.endpoint})})).json();alert('Enviado (código '+(r.status||r.error)+'). Debería llegar en segundos.')}catch(e){alert('Error: '+e.message)}}
function crt(on){S.cr.on=on?1:0;save();if(S.api&&'serviceWorker'in navigator&&'PushManager'in window)psub(on);else if(on&&window.Notification&&Notification.permission=='default')Notification.requestPermission()}
function crtime(v){S.cr.t=v;save();if(S.cr.on&&S.api&&'PushManager'in window)psub(1)}
function ex(t){let s,n;if(t=='j'){S.bk=td();save();s=JSON.stringify(S,null,1);n='nutrix.json'}else{s='fecha,comida,alimento,g,kcal,prot,carb,grasa\n'+Object.entries(S.log).flatMap(([d,a])=>a.map(x=>[d,x.m,'"'+x.n+'"',x.g,...T(x).map(v=>v.toFixed(1))].join(','))).join('\n');n='nutrix.csv'}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s]));a.download=n;a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.log&&!d.p)throw 0;if(!confirm('Esto reemplaza tus datos actuales. ¿Continuar?'))return;localStorage[K]=JSON.stringify(d);location.reload()}catch(e){alert('Archivo no válido')}};r.readAsText(f)}
function del(){if(confirm('¿Eliminar TODOS tus datos? No se puede deshacer.')){localStorage.removeItem(K);location.reload()}}
setInterval(()=>{if(!S.cr.on||S.cr.pu||S.cd[td()]||S.cn==td())return;if(new Date().toTimeString().slice(0,5)==S.cr.t){S.cn=td();save();try{new Notification('NUTRIX',{body:'💊 Hora de tu creatina'})}catch(e){alert('💊 Hora de tu creatina')}}},20000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
</script></body></html>
