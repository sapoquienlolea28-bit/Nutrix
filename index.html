function micro(L,t,g){if(!L.length)return'';const c=L.filter(x=>x.b.length>6).length,fr=R(g.k/1000*14),sl=R(g.k*.1/4),nl=g.a<4?1200:g.a<9?1500:g.a<14?1800:2300,bar=(l,v,m,u,tx)=>`<div class=bl><span>${l}</span><span>${R(v)} ${u} <small class=mu>${tx}</small></span></div><div class=tr><i style="width:${Math.min(100,v/m*100)}%"></i></div>`;

// PERFIL
function vPerfil(){const p=S.p||{a:'',s:'m',w:'',h:'',g:'e',act:1,fr:3,ty:''},g=tg(),o=(v,l,c)=>`<option value="${v}" ${c==v?'selected':''}>${l}</option>`;
return `<div class=card><b>${S.p?'Tu perfil':'Bienvenido a NUTRIX — gratis, sin suscripciones'}</b><p class=mu>Tus datos se guardan solo en este dispositivo.</p>Nombre<input id=pn value="${esc(p.nm||'')}" placeholder="Tu nombre">Edad<input id=pa type=number value="${p.a}">Sexo (solo para la fórmula metabólica)<select id=ps>${o('m','Hombre',p.s)}${o('f','Mujer',p.s)}</select>Peso (kg)<input id=pw type=number step=.1 value="${p.w}">Altura (cm)<input id=ph type=number value="${p.h}">Objetivo<select id=pg>${o('k','Mantenimiento',p.g)}${o('e','Alimentación equilibrada',p.g)}${o('x','Aumento de masa muscular',p.g)}</select>Ritmo de volumen (opcional, solo mayores de 18)<select id=pvs>${[['Suave (+8 %)'],['Moderado (+12 %)'],['Agresivo (+18 %)']].map((l,i)=>o(i,l[0],p.vs!=null?p.vs:1)).join('')}</select>Actividad diaria, sin contar el entrenamiento (NEAT)<select id=pneat>${['Casi todo el día sentado','De pie o caminando un poco','Camino bastante / estoy activo','Trabajo físico o muy activo'].map((l,i)=>o(i,l,p.neat!=null?p.neat:Math.min(p.act||0,3))).join('')}</select>Entrenamientos por semana<input id=pfr type=number value="${p.fr}">Tipo de entrenamiento<input id=pty value="${esc(p.ty||'')}" placeholder="Pesas, running, fútbol…">Preferencias alimentarias<input id=ppf value="${esc(p.pf||'')}" placeholder="Ej: vegetariano, alergias, no como cerdo"><button onclick=sp()>Guardar perfil</button></div>
${g?`<div class=card><b>Estimaciones</b><p>Nivel de actividad (DRI): <b>${g.lv}</b><br>Mínimo <b>${g.min}</b> · Objetivo <b>${g.k}</b> · Tope <b>${g.tope}</b> kcal<br>Proteína ~${g.p} g (${g.pr[0]}–${g.pr[1]}) · Carbohidratos ~${g.c} g · Grasas ~${g.f} g (${g.fr[0]}–${g.fr[1]})</p><small>Calculado con las ecuaciones EER de las DRI (${g.a<19?'adolescentes, incluyen crecimiento':'adultos'}). Mínimo y tope son los niveles de actividad DRI inferior y superior al tuyo: guías flexibles, no obligaciones. ${g.teen?'Hasta los 18 años no se aplican superávits ni déficits automáticos. ':''}${g.x?'Volumen: apunta a subir ~0,25–0,5 % de tu peso por semana. ':''}Son estimaciones y pueden necesitar ajustes. No recomendamos déficits agresivos. Si tienes una condición médica, consulta a tu profesional de salud.</small></div>
<div class=card><b>💊 Recordatorio de creatina</b><div class=row><label><input type=checkbox style=width:auto ${S.cr.on?'checked':''} onchange="crt(this.checked)"> Activar</label><input type=time value="${S.cr.t}" style=width:120px onchange="crtime(this.value)"></div><small>${S.cr.pu?'✓ Aviso en segundo plano activo.':'Con el servidor conectado y la app instalada avisa aunque esté cerrada; si no, solo con la app abierta.'}</small><div class=row style="flex-wrap:wrap;margin-top:8px">${S.cr.pu?'<button class=o onclick=ptest()>Probar aviso ahora</button>':''}<button class=o onclick=diag()>Diagnóstico del aviso</button></div></div>
<div class=card><b>Servidor de IA (USDA + fotos + entrenador)</b><input id=api value="${esc(S.api)}" placeholder="https://nutrix.tuusuario.workers.dev"><button class=o onclick="S.api=$('#api').value.trim().replace(/\\/$/,'');save();alert('Guardado')">Guardar URL</button><small>Sin esto la app funciona con la base local y registro manual. Ver worker.js.</small></div>
<div class=card><b>Copia de seguridad</b> <small class=mu>· NUTRIX ${VER}</small><p class=mu>${S.bk?'Última copia: '+S.bk:'Aún no has hecho una copia.'}</p><div class=row style=flex-wrap:wrap><button onclick="shareBk()">Compartir copia</button><button class=o onclick="ex('j')">Guardar copia</button><label class="btn o">Restaurar<input type=file accept=.json hidden onchange=imp(this)></label><button class=o onclick="ex('c')">CSV</button><button class=o onclick="del()">Eliminar todo</button></div></div>`:''}`}
function sp(){const v=i=>$('#'+i).value,p={nm:v('pn').trim(),pf:v('ppf').trim(),a:+v('pa'),s:v('ps'),w:+v('pw'),h:+v('ph'),g:v('pg'),vs:$('#pvs')?+v('pvs'):1,neat:+v('pneat'),fr:+v('pfr'),ty:v('pty')};if(!(p.a>=3&&p.a<=110&&p.w>0&&p.h>0))return alert('Completa edad (3 a 110), peso y altura.');S.p=p;save();V='hoy';render()}
const b64=x=>{x=(x+'='.repeat((4-x.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');return Uint8Array.from(atob(x),c=>c.charCodeAt(0))};
const swr=()=>Promise.race([navigator.serviceWorker.ready,new Promise((_,j)=>setTimeout(()=>j(new Error('el service worker no está activo. Cierra y abre la app; si sigue igual, falta sw.js en GitHub')),8000))]);
async function psub(on){try{const reg=await swr();let sub=await reg.pushManager.getSubscription();
if(!on){if(sub){await fetch(S.api+'/unsub',{method:'POST',body:JSON.stringify({endpoint:sub.endpoint})}).catch(()=>{});await sub.unsubscribe()}S.cr.pu=0;save();return render()}
if(Notification.permission!='granted'&&await Notification.requestPermission()!='granted')return alert('Las notificaciones no están permitidas ('+Notification.permission+'). En Chrome: toca el icono a la izquierda de la dirección → Permisos → Notificaciones → Permitir. O ve a Chrome → Configuración → Configuración de sitios → Notificaciones.');
const k=(await(await fetch(S.api+'/vapid')).json()).key;if(!k)throw new Error('el servidor no devolvió la clave');
sub=sub||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(k)});
const r=await(await fetch(S.api+'/sub',{method:'POST',body:JSON.stringify({sub,t:S.cr.t,off:new Date().getTimezoneOffset()})})).json();if(r.error)throw new Error(r.error);
S.cr.pu=1;save();render();alert('Listo: recibirás el aviso a las '+S.cr.t+' aunque la app esté cerrada.')}catch(e){alert('No se pudo activar el aviso en segundo plano: '+e.message)}}
async function diag(){const L=[];try{
L.push('Permiso: '+(window.Notification?Notification.permission:'no soportado'));
L.push('Servidor: '+(S.api?'configurado':'FALTA la URL en Perfil'));
L.push('Hora: '+S.cr.t+' · zona UTC'+(-new Date().getTimezoneOffset()/60));
L.push('Activado: '+(S.cr.on?'sí':'no')+' · push guardado: '+(S.cr.pu?'sí':'no'));
if(!('serviceWorker'in navigator&&'PushManager'in window))L.push('Este navegador no soporta push');else{
let reg;try{reg=await swr();L.push('Service worker: activo')}catch(e){L.push('Service worker: NO activo ('+e.message+')')}
if(reg){const sub=await reg.pushManager.getSubscription();L.push('Suscripción en el teléfono: '+(sub?'sí':'no'));
if(S.api){try{const v=await(await fetch(S.api+'/vapid')).json();L.push('Servidor /vapid: '+(v.key?'ok':v.error))}catch(e){L.push('Servidor /vapid: error '+e.message)}
if(sub){try{const r=await(await fetch(S.api+'/test',{method:'POST',body:JSON.stringify({endpoint:sub.endpoint})})).json();L.push('Prueba de envío: '+(r.status??r.error)+(r.status==201?' (enviado, debe llegar la notificación)':''))}catch(e){L.push('Prueba de envío: error '+e.message)}}}}}
}catch(e){L.push('Error: '+e.message)}alert(L.join('\n'))}
async function ptest(){try{const s=await(await swr()).pushManager.getSubscription();if(!s)return alert('Primero activa el recordatorio.');const r=await(await fetch(S.api+'/test',{method:'POST',body:JSON.stringify({endpoint:s.endpoint})})).json();alert('Enviado (código '+(r.status||r.error)+'). Debería llegar en segundos.')}catch(e){alert('Error: '+e.message)}}
function crt(on){S.cr.on=on?1:0;save();if(on&&window.Notification&&Notification.permission=='default'){Notification.requestPermission().then(()=>{if(S.api&&'serviceWorker'in navigator&&'PushManager'in window)psub(1);render()});return}if(S.api&&'serviceWorker'in navigator&&'PushManager'in window)psub(on);else if(on&&window.Notification&&Notification.permission=='default')Notification.requestPermission()}
function crtime(v){S.cr.t=v;save();if(S.cr.on&&S.api&&'PushManager'in window)psub(1)}
function ex(t){let s,n;if(t=='j'){S.bk=td();save();s=JSON.stringify(S,null,1);n='nutrix.json'}else{s='fecha,comida,alimento,g,kcal,prot,carb,grasa\n'+Object.entries(S.log).flatMap(([d,a])=>a.map(x=>[d,x.m,'"'+x.n+'"',x.g,...T(x).map(v=>v.toFixed(1))].join(','))).join('\n');n='nutrix.csv'}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s]));a.download=n;a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.log&&!d.p)throw 0;if(!confirm('Esto reemplaza tus datos actuales. ¿Continuar?'))return;localStorage[K]=JSON.stringify(d);location.reload()}catch(e){alert('Archivo no válido')}};r.readAsText(f)}
function del(){if(confirm('¿Eliminar TODOS tus datos? No se puede deshacer.')){localStorage.removeItem(K);location.reload()}}
setInterval(()=>{if(!S.cr.on||S.cr.pu||S.cd[td()]||S.cn==td())return;if(new Date().toTimeString().slice(0,5)==S.cr.t){S.cn=td();save();try{new Notification('NUTRIX',{body:'💊 Hora de tu creatina'})}catch(e){alert('💊 Hora de tu creatina')}}},20000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
</script></body></html>
